[project]
name = "sgj"
version = "0.1.0"
description = "Sistema de gestão jurídica: núcleo, motor de prazos e integrações"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sgj*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
