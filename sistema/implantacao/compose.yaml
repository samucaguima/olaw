# Aplicativo no servidor. Uso: docker compose up -d --build (neste diretório).
# A porta só é publicada no próprio servidor (127.0.0.1); o acesso externo é
# feito pela rede privada Tailscale (tailscale serve), nunca pela internet.
services:
  sgj:
    build:
      context: ..
      dockerfile: implantacao/Dockerfile
    env_file: .env
    environment:
      SGJ_AMBIENTE: rede_privada
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
